services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ggprint}
      POSTGRES_USER: ${POSTGRES_USER:-ggprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ggprint_change_me}
    volumes:
      - ggprint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ggprint} -d ${POSTGRES_DB:-ggprint}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ggprint}:${POSTGRES_PASSWORD:-ggprint_change_me}@postgres:5432/${POSTGRES_DB:-ggprint}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-production-secret}
      DEV_SEED: ${DEV_SEED:-false}
      INSTITUTION: ${INSTITUTION:-Cégep Gérald-Godin}
      DATA_DIR: /data
      SAMPLE_MODELS_DIR: /app/sample-models
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://localhost:8080","http://localhost:5173"]}
    volumes:
      - ggprint_data:/data
      - ggprint_profiles:/profiles
      # Uncomment on Proxmox once OrcaSlicer AppImage is extracted to /opt/orcaslicer:
      # - /opt/orcaslicer:/opt/orcaslicer:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  ggprint_pgdata:
  ggprint_data:
  ggprint_profiles:
