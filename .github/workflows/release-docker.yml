name: Publish Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            file: backend/Dockerfile
            arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - service: backend
            context: .
            file: backend/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - service: frontend
            context: ./frontend
            file: frontend/Dockerfile
            arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - service: frontend
            context: ./frontend
            file: frontend/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository slug
        id: repo
        run: echo "lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}-${{ matrix.service }}

      - name: Build and push ${{ matrix.service }} (${{ matrix.arch }}) by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

      - name: Save image digest
        run: |
          mkdir -p /tmp/digests
          printf '%s' "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}.digest"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*.digest
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish Multi-Arch Manifest (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Lowercase repository slug
        id: repo
        run: echo "lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}-${{ matrix.service }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create and inspect multi-arch manifest list
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}-${{ matrix.service }}
          TAGS_MULTILINE: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS+=(-t "$tag")
          done <<< "$TAGS_MULTILINE"

          DIGEST_REFS=()
          for f in /tmp/digests/*.digest; do
            DIGEST_REFS+=("${IMAGE}@$(tr -d '[:space:]' < "$f")")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_REFS[@]}"
          FIRST_TAG=$(printf '%s\n' "$TAGS_MULTILINE" | head -n 1)
          docker buildx imagetools inspect "$FIRST_TAG"
